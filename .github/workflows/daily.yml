# The whole channel, hands-off, with no Claude and nothing paid:
# - daily run: review yesterday's clips (analytics steer the edit), scan what's trending, find today's moments
#   (comment timestamps, chat spikes, most-replayed, Twitch clips), write scripts with a free local model (Ollama),
#   cut, and post to YouTube, TikTok, Instagram and Facebook.
# - 7-day reach experiment: one strongest, distinct clip per day; keep posting volume low enough to compare Studio metrics.
name: Late Recaps daily

on:
  schedule:
    - cron: "17 11 * * *"           # daily run, ~7 AM Eastern (GitHub often starts scheduled runs late)
    - cron: "47 17 * * *"           # retry: only runs if nothing was posted yet today
    # More backups. GitHub sometimes drops scheduled runs outright (Nov 2: neither of the two above started), and
    # each backup skips itself once today's clips are out, so these never double-post.
    - cron: "41 14 * * *"
    - cron: "53 20 * * *"
    - cron: "11 23 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "daily = full run, spike = only clip what's blowing up right now"
        type: choice
        options: [daily, spike]
        default: daily
      post:
        description: "Post the clips (untick for a test run that builds and cuts but doesn't upload)"
        type: boolean
        default: true

concurrency:
  group: late-recaps-posting
  cancel-in-progress: false
  # Keep scheduled daily backups and spike scans queued instead of replacing pending runs.
  queue: max

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    services:
      pot:   # makes YouTube "proof of origin" tokens so downloads from cloud servers look less like a bot
        image: brainicism/bgutil-ytdlp-pot-provider
        ports:
          - 4416:4416
    env:
      PYTHONUTF8: "1"
      CUDA_VISIBLE_DEVICES: "-1"
      NARRATOR_ENGINE: chatterbox
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}           # free, dev.twitch.tv: live Twitch clips
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}         # Instagram + Facebook Reels (README)
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}               # free script writer (aistudio.google.com/apikey); real commentary
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}                   # free backup writer (console.groq.com/keys)
      OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || 'qwen2.5:7b' }}     # free local script writer; no Claude
      OLLAMA_MODELS: /home/runner/.ollama-models
      # Unload the script model right after each answer. Left loaded (~5 GB), it plus the Chatterbox voice and the
      # ffmpeg render ran the private-repo runner (~7 GB RAM) out of memory mid-render on Nov 6-7: nothing posted.
      OLLAMA_KEEP_ALIVE: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50   # the already-posted-today check reads recent commits; a 1-commit clone can't see them

      - name: Which run is this
        id: mode
        run: |
          mode=daily
          if [ "${{ github.event.schedule }}" = "23 0,3,6,9,12,15,18,21 * * *" ] || [ "${{ inputs.mode }}" = spike ]; then mode=spike; fi
          post=true
          if [ "${{ github.event_name }}" = workflow_dispatch ] && [ "${{ inputs.post }}" != true ]; then post=false; fi
          skip=false
          # a late scheduled daily run after one that already posted shouldn't double-post
          if [ $mode = daily ] && [ "${{ github.event_name }}" = schedule ] && git log -20 --since="36 hours ago" --format=%s | grep -qx "Daily run $(TZ=America/New_York date +%F)"; then
            echo "Already ran today; skipping."; skip=true
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"; echo "post=$post" >> "$GITHUB_OUTPUT"; echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "Mode: $mode, post: $post, skip: $skip"

      - uses: actions/setup-python@v5
        if: steps.mode.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - uses: denoland/setup-deno@v2   # JavaScript runtime yt-dlp needs for YouTube
        if: steps.mode.outputs.skip != 'true'
        with:
          deno-version: v2.x

      - name: Free disk space   # the narrator, script and caption models need ~15 GB; the runner image ships ~30 GB of SDKs we never use
        if: steps.mode.outputs.skip != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/share/swift /usr/local/.ghcup /usr/local/share/powershell /usr/local/share/chromium || true
          df -h / | tail -1
          free -m | head -2

      - name: Install tools
        if: steps.mode.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-liberation
          pip install -q -r requirements.txt bgutil-ytdlp-pot-provider
          # Chatterbox 0.1.7 requires NumPy 1.x on Python 3.12; the runner's NumPy 2.x
          # was incompatible and caused narration to fall back on every clip.
          pip install -q --no-deps chatterbox-tts
          pip install -q "numpy>=1.24,<2" librosa==0.11.0 s3tokenizer transformers==5.2.0 diffusers==0.29.0 "resemble-perth @ git+https://github.com/resemble-ai/Perth.git@master" conformer==0.3.2 \
            safetensors==0.5.3 pyloudnorm omegaconf torch==2.6.0 torchaudio==2.6.0 \
            --extra-index-url https://download.pytorch.org/whl/cpu

      - name: TikTok sign-in cache   # TikTok can hand out a new refresh token; the newest one is kept here
        if: steps.mode.outputs.skip != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/.config/clip-builder/tiktok_token.json
          key: tiktok-token-${{ github.run_id }}
          restore-keys: tiktok-token-

      - name: Sign-ins and cookies
        if: steps.mode.outputs.skip != 'true'
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
          REVIEW_TOKEN: ${{ secrets.REVIEW_TOKEN }}
          TIKTOK_TOKEN: ${{ secrets.TIKTOK_TOKEN }}
          ACTIVITY_TOKEN: ${{ secrets.ACTIVITY_TOKEN }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          YT_PROXY: ${{ secrets.YT_PROXY }}
        run: |
          d=~/.config/clip-builder; mkdir -p "$d"
          [ -n "$YOUTUBE_TOKEN" ] && printf '%s' "$YOUTUBE_TOKEN" | sed '1s/^\xEF\xBB\xBF//' > "$d/youtube_token.json"
          [ -n "$REVIEW_TOKEN" ] && printf '%s' "$REVIEW_TOKEN" | sed '1s/^\xEF\xBB\xBF//' > "$d/review_token.json"
          [ -n "$ACTIVITY_TOKEN" ] && printf '%s' "$ACTIVITY_TOKEN" | sed '1s/^\xEF\xBB\xBF//' > "$d/activity_token.json"
          # TikTok: keep the cached login (TikTok rotates refresh tokens), unless the secret is a newer sign-in with a
          # permission the cached one lacks (Nov 14: video.list added for the review's TikTok views)
          if [ -n "$TIKTOK_TOKEN" ]; then
            printf '%s' "$TIKTOK_TOKEN" | sed '1s/^\xEF\xBB\xBF//' > "$RUNNER_TEMP/tt_secret.json"
            if [ ! -f "$d/tiktok_token.json" ] || python -c "import json,sys; s=lambda f: set(json.load(open(f,encoding='utf-8-sig')).get('scope','').split(',')); sys.exit(0 if s(sys.argv[1]) - s(sys.argv[2]) else 1)" "$RUNNER_TEMP/tt_secret.json" "$d/tiktok_token.json"; then
              cp "$RUNNER_TEMP/tt_secret.json" "$d/tiktok_token.json"; echo "TikTok: using the login from the TIKTOK_TOKEN secret"
            fi
            rm -f "$RUNNER_TEMP/tt_secret.json"
          fi
          mkdir -p ~/.config/yt-dlp; : > ~/.config/yt-dlp/config
          if [ -n "$YT_PROXY" ]; then   # home-internet proxy: YouTube bot-blocks downloads from cloud servers
            echo "--proxy $YT_PROXY" >> ~/.config/yt-dlp/config
          fi
          if [ -n "$YT_COOKIES" ]; then   # signed-in YouTube cookies, the free alternative
            if printf '%s' "$YT_COOKIES" | head -c 200 | grep -q '[[:space:]]'; then   # plain cookies.txt
              printf '%s' "$YT_COOKIES" > "$RUNNER_TEMP/cookies.txt"
            else   # gzipped + base64, to fit GitHub's 48 KB secret limit
              printf '%s' "$YT_COOKIES" | base64 -d | gunzip > "$RUNNER_TEMP/cookies.txt"
            fi
            echo "YouTube cookies: $(grep -c youtube.com "$RUNNER_TEMP/cookies.txt") lines"
            echo "--cookies $RUNNER_TEMP/cookies.txt" >> ~/.config/yt-dlp/config
          fi
          # Secrets set from Windows PowerShell can start with a UTF-8 BOM, which the Google client can't parse
          # (Nov 13: the upload crashed on it); the sed above strips it.
          chmod 600 "$d"/*.json 2>/dev/null || true

      - name: Check YouTube download
        if: steps.mode.outputs.skip != 'true' && steps.mode.outputs.mode == 'daily'
        continue-on-error: true
        run: |
          yt-dlp -v --simulate --skip-download "https://www.youtube.com/watch?v=jNQXAC9IVRw" 2>&1 | grep -iE "cookie|logged|login|po.?token|pot|sign in|error|player client|Downloading .*player|bot" | grep -viE "^\[debug\] (Command-line|Encodings|Python|exe|Optional|Proxy|Request Handlers|Plugin directories)" | head -40 || true

      # ----- spike check: cheap look first; the heavy tools below only load if something is blowing up -----
      - name: Anything blowing up right now?
        id: spike
        if: steps.mode.outputs.skip != 'true' && steps.mode.outputs.mode == 'spike'
        run: |
          python channel_builder.py spike 2>&1 | tee -a builder.log "$RUNNER_TEMP/run.log"
          q=$(grep -oE "Queue: [^ ]+queue.md" "$RUNNER_TEMP/run.log" | tail -1 | sed -E 's/^Queue: //; s#/queue.md$##')
          echo "queue=$q" >> "$GITHUB_OUTPUT"

      - name: Narrator voice cache
        if: steps.mode.outputs.skip != 'true' && (steps.mode.outputs.mode == 'daily' || steps.spike.outputs.queue != '')
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/clip-builder/kokoro
            ~/.cache/huggingface
          key: narrator-kokoro-v1.0-chatterbox-turbo

      - name: Whisper model cache
        if: steps.mode.outputs.skip != 'true' && (steps.mode.outputs.mode == 'daily' || steps.spike.outputs.queue != '')
        uses: actions/cache@v4
        with:
          path: ~/.cache/clip-builder/whisper
          key: whisper-small.en

      - name: Script-writer model cache
        if: steps.mode.outputs.skip != 'true' && (steps.mode.outputs.mode == 'daily' || steps.spike.outputs.queue != '')
        uses: actions/cache@v4
        with:
          path: /home/runner/.ollama-models
          key: ollama-${{ env.OLLAMA_MODEL }}

      - name: Start the free script writer (Ollama)
        if: steps.mode.outputs.skip != 'true' && (steps.mode.outputs.mode == 'daily' || steps.spike.outputs.queue != '')
        continue-on-error: true   # without it the scripts come from free_writer.py instead, still no Claude
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama 2>/dev/null || true
          nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:11434/api/tags >/dev/null && break; sleep 1; done
          ollama pull "$OLLAMA_MODEL"
          ollama list

      - name: Review agent
        id: review
        if: steps.mode.outputs.skip != 'true'
        continue-on-error: true   # the pre-post check holds posting if the review didn't run
        # --no-llm: on the runner's CPU the written review takes 15+ minutes and times out; the numbers, diagnoses
        # and the edit tuner's scoring (what actually steers tomorrow) are all rule-based and still run
        run: python review_agent.py --no-llm 2>&1 | tee -a review.log

      - name: Reply study (how top clip channels reply to comments; weekly)
        if: steps.mode.outputs.skip != 'true' && steps.mode.outputs.mode == 'daily'
        continue-on-error: true   # never holds up the clips; the activity agent drafts without a guide if this fails
        # Reads public comments with YOUTUBE_API_KEY only (~120 units); never signs in or posts. Writes
        # reports/activity/reply_playbook.json, which the activity agent drafts from.
        run: python reply_study_agent.py --if-older 7 2>&1 | tee -a activity.log

      - name: Channel activity (comment replies, first comments, community post drafts)
        if: steps.mode.outputs.skip != 'true' && steps.mode.outputs.mode == 'daily'
        continue-on-error: true   # never holds up the clips
        # Drafts only until the repo variable ACTIVITY_POST is "true" (Settings > Secrets and variables > Actions >
        # Variables): Philip wants replies studied before any go out. Posting also needs the ACTIVITY_TOKEN sign-in.
        # Either way it checks the upload schedule and writes the drafts to reports/activity_<date>/.
        run: |
          flag=--post
          [ "${{ vars.ACTIVITY_POST }}" = true ] && [ "${{ steps.mode.outputs.post }}" = true ] && [ -f ~/.config/clip-builder/activity_token.json ] || flag=
          echo "Activity: ${flag:-drafts only}"
          python channel_activity_agent.py $flag --max-replies 10 2>&1 | tee -a activity.log

      - name: Save completed agent review
        if: steps.mode.outputs.skip != 'true' && steps.review.outcome == 'success'
        run: |
          git config user.name "late-recaps-bot"
          git config user.email "late-recaps-bot@users.noreply.github.com"
          git add -A reports review.log; [ -f activity.log ] && git add activity.log
          if ! git diff --cached --quiet; then
            git commit -qm "Agent review $(TZ=America/New_York date +%F)"
            git push -q || (git pull -q --rebase && git push -q)
          fi

      - name: Build, cut and post
        if: steps.mode.outputs.skip != 'true' && steps.mode.outputs.mode == 'daily'
        run: |
          flag=--publish; [ "${{ steps.mode.outputs.post }}" = true ] || flag=
          # memory log: the runner was being killed mid-cut; this shows whether RAM is what runs out
          (while sleep 60; do free -m | awk 'NR==2{print "[mem] used " $3 " MB of " $2 " MB"}'; done) & mem=$!
          MAX_POSTS=1 python channel_builder.py run $flag --niche streamer --count 3 2>&1 | tee -a builder.log "$RUNNER_TEMP/run.log"; rc=${PIPESTATUS[0]}
          kill $mem 2>/dev/null || true
          exit $rc

      - name: Post the spike clip
        if: steps.spike.outputs.queue != '' && steps.mode.outputs.post == 'true'
        run: |
          python channel_builder.py publish --queue "${{ steps.spike.outputs.queue }}" 2>&1 | tee -a builder.log "$RUNNER_TEMP/run.log"; exit ${PIPESTATUS[0]}

      - name: Cut the spike clip (test run, not posted)
        if: steps.spike.outputs.queue != '' && steps.mode.outputs.post != 'true'
        run: |
          for id in $(python -c "import json,sys; print(' '.join(str(c['id']) for c in json.load(open(sys.argv[1]))))" "${{ steps.spike.outputs.queue }}/queue.json"); do
            python channel_builder.py cut "$id" --queue "${{ steps.spike.outputs.queue }}" 2>&1 | tee -a "$RUNNER_TEMP/run.log"
          done

      - name: Today's clips (download from the run page to post by hand)
        if: always() && steps.mode.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: clips-${{ github.run_number }}
          path: |
            reports/builder/*_20*/clips/[0-9][0-9]_*.mp4
            reports/builder/*_20*/clips/[0-9][0-9]_*.txt
            !reports/builder/*_20*/clips/*.source.mp4
          retention-days: 7
          if-no-files-found: ignore

      - name: Keep TikTok sign-in
        if: always() && steps.mode.outputs.skip != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.config/clip-builder/tiktok_token.json
          key: tiktok-token-${{ github.run_id }}

      - name: Save reports and state
        if: always() && steps.mode.outputs.skip != 'true'
        run: |
          git config user.name "late-recaps-bot"
          git config user.email "late-recaps-bot@users.noreply.github.com"
          git add -A reports builder.log review.log
          if [ "${{ steps.mode.outputs.mode }}" = spike ]; then msg="Spike check $(TZ=America/New_York date +%F)"; else msg="Daily run $(TZ=America/New_York date +%F)"; fi   # the channel's day is Eastern
          grep -q "  uploaded https://youtube.com/shorts/" "$RUNNER_TEMP/run.log" 2>/dev/null || msg="$msg (nothing posted)"
          git diff --cached --quiet || git commit -qm "$msg"
          git push -q || (git pull -q --rebase && git push -q)

      - name: Warn if YouTube cookies expired   # fails the run so GitHub emails you
        if: always() && steps.mode.outputs.skip != 'true'
        run: |
          if grep -qE "confirm you.re not a bot|cookies are no longer valid" "$RUNNER_TEMP/run.log" 2>/dev/null; then
            echo "::error::YouTube cookies expired. Export fresh ones from a private Zen window and save them as YT_COOKIES."
            exit 1
          fi

