name: Retry interrupted clip builds

on:
  workflow_run:
    workflows: ["Late Recaps daily"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  retry-runner-shutdown:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'schedule' &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retry only a runner shutdown before any post
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if ! gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log > "$RUNNER_TEMP/run.log"; then
            echo "Could not retrieve the failed run log; leaving it for the next scheduled backup."
            exit 0
          fi
          if ! grep -Fq "runner has received a shutdown signal" "$RUNNER_TEMP/run.log" ||
             ! grep -Fq "Process completed with exit code 143" "$RUNNER_TEMP/run.log"; then
            echo "Failure was not a GitHub runner shutdown; no automatic retry."
            exit 0
          fi
          if grep -Eq 'uploaded https://youtube.com/shorts/|TikTok: \[[^]]+\] (posted|draft in your TikTok inbox)|Instagram: \[[^]]+\] posted|Facebook: \[[^]]+\] posted' "$RUNNER_TEMP/run.log"; then
            echo "A destination already received a clip; skipping retry to avoid duplicates."
            exit 0
          fi
          gh run rerun "$RUN_ID" --failed --repo "$GITHUB_REPOSITORY"
          echo "Queued one safe retry for runner shutdown $RUN_ID."
