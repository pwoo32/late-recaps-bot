# Reply study on its own: how the top clip channels reply to comments. The daily run also does this weekly; this
# runs it right away (Actions > Reply study > Run workflow, or on a push that changes the agent). Read-only: it never
# signs in to the channel or posts anything.
name: Reply study

on:
  workflow_dispatch:
  push:
    paths:
      - reply_study_agent.py
      - .github/workflows/reply-study.yml

concurrency:
  group: reply-study-${{ github.ref }}

permissions:
  contents: write

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - run: python reply_study_agent.py --channels 20 2>&1 | tee reply_study.log
      - name: Save the report and guide
        if: always()
        run: |
          git config user.name "late-recaps-bot"
          git config user.email "late-recaps-bot@users.noreply.github.com"
          git add -A reports
          git diff --cached --quiet || git commit -qm "Reply study $(TZ=America/New_York date +%F)"
          git push -q || (git pull -q --rebase && git push -q)
