name: Voice test
on:
  push:
    branches: [claude/project-thread-njugdq]
    paths: [tools/voice_test.py, .github/workflows/voice-test.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  voices:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: |
          pip install -q -r requirements.txt
          pip install -q --no-deps chatterbox-tts
          pip install -q "numpy>=1.24,<2" librosa==0.11.0 s3tokenizer transformers==5.2.0 diffusers==0.29.0 resemble-perth conformer==0.3.2 \
            safetensors==0.5.3 pyloudnorm omegaconf torch==2.6.0 torchaudio==2.6.0 \
            --extra-index-url https://download.pytorch.org/whl/cpu
      - run: python tools/voice_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: chatterbox-voice-check-${{ github.run_number }}
          path: voice-samples/
          retention-days: 3

