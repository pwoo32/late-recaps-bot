name: Voice test
on:
  push:
    branches: [claude/project-thread-njugdq]
    paths: [tools/voice_test.py, .github/workflows/voice-test.yml]
permissions:
  contents: write
jobs:
  voices:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: |
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r requirements.txt chatterbox-tts --extra-index-url https://download.pytorch.org/whl/cpu
      - run: python tools/voice_test.py
      - run: |
          git config user.name late-recaps-bot
          git config user.email late-recaps-bot@users.noreply.github.com
          git add voice-samples
          git commit -m "Voice test samples [skip ci]" && git push
