name: Voice test
on:
  push:
    branches: [claude/project-thread-njugdq]
    paths: [tools/voice_test.py, .github/workflows/voice-test.yml]
permissions:
  contents: write
jobs:
  voices:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: |
          pip install -q -r requirements.txt
          pip install -q --no-deps chatterbox-tts
          pip install -q librosa==0.11.0 s3tokenizer transformers==5.2.0 diffusers==0.29.0 resemble-perth conformer==0.3.2 \
            safetensors==0.5.3 pyloudnorm omegaconf torch==2.6.0 torchaudio==2.6.0 \
            --extra-index-url https://download.pytorch.org/whl/cpu
      - run: python tools/voice_test.py
      - run: |
          git config user.name late-recaps-bot
          git config user.email late-recaps-bot@users.noreply.github.com
          git add voice-samples
          git commit -m "Voice test samples [skip ci]" && git push
